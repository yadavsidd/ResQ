allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

rootProject.ext.flutter = [
    compileSdkVersion: 36,
    minSdkVersion: 26,
    targetSdkVersion: 36
]

subprojects {
    project.evaluationDependsOn(":app")

    // Force all Android library plugins (e.g. path_provider_android) to compile
    // against SDK 36. This avoids the JDK 21 jlink crash caused by
    // core-for-system-modules.jar in SDK 34, whose filename contains the Java
    // reserved keyword "for" and is rejected by the module-path scanner.
    project.plugins.withId("com.android.library") {
        project.android {
            compileSdkVersion 36
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
